  notes: "The page links Oil_Gas_Production_All_Years.xlsx (14,332,260 bytes on 23 Oct 2026) and UIC_InjectionData_All_Years.xlsx on sddenr.net, a field-name key, 2025 tables and county well maps (PDF, 07.11.2025). Well data are in the SDGS Online Oil and Gas Database and Interactive Data Map; a geodatabase of wells, recovery units and fields is at http://www.sdgs.usd.edu/SDOIL/oilgas_databases.aspx."
