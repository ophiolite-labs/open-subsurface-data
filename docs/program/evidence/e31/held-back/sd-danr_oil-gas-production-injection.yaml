id: sd-danr/oil-gas-production-injection
title: Oil and Gas Data/Reports (South Dakota production and injection data)
summary: >-
  South Dakota DANR's oil and gas data page: "Monthly Production Reports for Oil & Gas Wells" (MS Excel,
  1950 to present) and "Monthly Injection Reports for Water, Air, and Gas Injection Wells" (1977 to
  present), with enhanced recovery unit production and injection, yearly field production tables and
  county maps of wells, test holes and fields.
