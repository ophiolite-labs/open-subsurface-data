id: prime/national-oil-gas-database
title: "PRIME: The National Oil and Natural Gas Database (Israel)"
summary: >-
  Data and information on oil and gas exploration and production activity onshore and offshore
  Israel. Geological, geophysical, engineering and environmental data handed over by operators
  and petroleum right owners to the Petroleum Commissioner's office are uploaded and managed in
  PRIME; a GIS map shows well, seismic, gravity and magnetic data and active licences.
