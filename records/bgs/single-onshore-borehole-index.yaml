  url: https://www.bgs.ac.uk/datasets/boreholes-index/
  access: anonymous
  manifest_url: https://www.bgs.ac.uk/download/single-onshore-borehole-index-sobi-dataset/?wpdmdl=125849
  notes: "Also served as OGC API Features, WMS (Boreholes theme) and through GeoIndex. The download page https://www.bgs.ac.uk/download/single-onshore-borehole-index-sobi-dataset/ (75.58 MB, updated 16 Oct 2026) serves sobi-borehole.zip at the manifest_url."
