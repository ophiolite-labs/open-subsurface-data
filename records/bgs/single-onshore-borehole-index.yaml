id: bgs/single-onshore-borehole-index
title: Single Onshore Borehole Index (SOBI)
summary: >-
  An index of over one million records of boreholes, shafts and wells from all forms of drilling and site investigation work held by the BGS, covering onshore and near-shore Great Britain from at least 1790, from one to several thousand metres deep. Individual borehole scans are linked from the BGS borehole record viewer.
