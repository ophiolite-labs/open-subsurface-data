id: bgs/co2-stored
title: CO2 Stored (the UK CO2 Storage Evaluation Database)
summary: >-
  "CO2 Stored provides access to world-leading overview data for over 500 potential CO2 storage sites
  around offshore UK", including storage units in saline aquifers, oil fields and gas fields. Hosted
  and developed by the British Geological Survey with The Crown Estate; the original data came from
  the ETI-funded UK Storage Appraisal Project (UKSAP).
publisher: {name: British Geological Survey, url: https://www.bgs.ac.uk, country: GB}
