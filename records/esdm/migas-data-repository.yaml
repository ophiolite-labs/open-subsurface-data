id: esdm/migas-data-repository
title: MDR | Migas Data Repository (Indonesia)
summary: >-
  Indonesia's upstream oil and gas data repository run by the Ministry of Energy and Mineral
  Resources data centre (Pusdatin ESDM), holding physical and digital well logs, processed 2D
  and 3D seismic, well samples and cores across the country's working areas, with a public
  well and seismic availability map on the ESDM One Map geoportal.
publisher: {name: "Pusat Data dan Teknologi Informasi (Pusdatin), Kementerian Energi dan Sumber Daya Mineral", url: https://datamigas.esdm.go.id, country: ID}
origin:
  url: https://datamigas.esdm.go.id/home
  access: request
  notes: "Membership system with login and MFA; non-members apply to Pusdatin ESDM. Public availability maps (Peta Well, Peta Seismic 2D and 3D) at https://geoportal.esdm.go.id/home/map/migas. Physical export abroad needs ministerial approval."
