id: odnr/oil-and-gas-well-database
title: Oil & Gas Well Database (RBDMS)
summary: >-
  The Ohio Department of Natural Resources, Division of Oil and Gas Resources Management, Risk
  Based Data Management System (RBDMS): well records including completion, permit and production
  information for over 100,000 wells permitted since 1980, with historical well card information
  for wells permitted before 1980, as an online search and a downloadable Microsoft Access
  database.
