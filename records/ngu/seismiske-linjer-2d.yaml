id: ngu/seismiske-linjer-2d
title: Seismiske linjer, 2D (NGU)
summary: >-
  "Seismiske linjer, 2D viser hvor NGU har samlet inn seismiske data og sedimentekkoloddata.
  Databasen inneholder også data fra MAREANO og en del eksterne data, blant annet fra IKU": marine
  2D seismic and sediment echo-sounder lines with equipment and acquisition parameters; digital
  lines (after 1990, and some digitised analogue lines) link to thumbnail images of the profiles.
