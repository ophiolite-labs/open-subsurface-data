id: equinor/drogon
title: Drogon FMU model
summary: >-
  Drogon is a synthetic reservoir model developed and maintained by Equinor, the successor of the
  Reek model, with a complete FMU (Fast Model Update) set-up: Eclipse simulation decks and include
  files, an RMS project archive, sim2seis, ERT and webviz configuration.
