id: fl-dep/oil-gas-permit-database
title: Oil and Gas Permit Database
summary: >-
  "This spreadsheet is a compilation of information on all permitted wells in the state. The
  spreadsheet provides a quick search tool on the "Facility Information" tab, relevant well
  information on the "Wells" tab which can be sorted or filtered as needed, and some general
  statistics on the "Totals" tab." Updated quarterly or as needed; last updated September 8, 2026.
