id: mra-pg/geoscientific-data
title: Geoscience Data (Geological Database System and Explorer 3, MRA Papua New Guinea)
summary: >-
  "All minerals data in the custody of the Mineral Resources Authority (MRA) is in the Geological
  Database System, managed by the Geological Survey Division." Point data from archived exploration
  reports are held in Explorer 3 ("over 900,000 point data"); maps and Geological Survey reports are
  sold from a published price list.
