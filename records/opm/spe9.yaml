  Reservoir simulation decks for the Ninth SPE Comparative Solution Project (Killough, 1995, a
  reexamination of black-oil simulation) in the Open Porous Media opm-data repository: a 24 x 25 x 15
  grid with Cartesian and corner-point geometry variants, permeability and tops include files.
