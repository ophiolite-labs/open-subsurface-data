id: geosphere-at/aerogeophysics-northern-lower-austria
title: Aerogeophysical data - Northern Lower Austria (magnetic, radiometric and electromagnetic data)
summary: >-
  Geomagnetic, electromagnetic and radiometric (Th, U, K) data from five helicopter surveys flown
  between 1983 and 1997 in the northern part of Lower Austria around the Diendorf fault system:
  Geras (1996, 1997), Pulkau North (1995), Pulkau (1994), Kamptal-Ziersdorf (1983) and Krems
  (1983); the magnetic and electromagnetic sets were combined and reprocessed in 1998.
