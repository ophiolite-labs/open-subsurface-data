id: geosphere-at/molasse-basin-subsurface-model
title: Geological subsurface model of the Austrian Molasse Basin
summary: >-
  Geological 3D subsurface model of the Molasse Basin in Lower and Upper Austria and Salzburg,
  built in SKUA-GOCAD from all published subsurface information (geological maps,
  cross-sections, contour maps and geophysical data) as a basis for subsurface management of
  mining, geothermal energy and gas and CO2 storage; the modelled geological layers are
  published as DXF files with a data description document.
