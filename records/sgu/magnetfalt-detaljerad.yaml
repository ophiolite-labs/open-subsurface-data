title: Geofysiska flygmätningar, magnetfält (detaljerad)
summary: >-
  "Geofysiska flygmätningar, magnetfält (detaljerad) innehåller uppmätta variationer i det
  magnetiska totalfältet före och efter subtraktion av det geomagnetiska referensfältet (DGRF
  1965.0). Data innehåller värden för enskilda mätpunkter." Airborne magnetic point data over
  Sweden, in 450 flight areas.
