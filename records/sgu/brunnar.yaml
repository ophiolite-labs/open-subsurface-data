id: sgu/brunnar
title: Brunnar (wells)
summary: >-
  "I dataprodukten Brunnar finns uppgifter om enskilda brunnars läge. Det finns också information om
  djup, jorddjup, foderrörslängd, dimensioner, vattenkapacitet, vattennivåer och vad brunnen har för
  funktion." Mainly rock-drilled wells, reported by well drillers to SGU as required by law since
  1976.
