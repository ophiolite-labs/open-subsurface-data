id: sgu/borrhal
title: Borrkärnor och borrhål (Borrhål)
summary: >-
  "Produkten Borrhål visar koordinatsatt information om borrhål och borrkärnor. Data finns även från
  skannade och analyserade borrkärnor från SGU:s arkiv." (The product shows georeferenced boreholes
  and drill cores, from exploration and construction drilling across Sweden, with links to cores
  photographed and scanned with hyperspectral infrared from SGU's archive.)
