id: sgu/tyngdkraft
title: Tyngdkraft (gravity data)
summary: >-
  "Dataprodukterna visar uppmätta variationer i jordskorpans massfördelning. Dessa variationer beror
  på skillnader i markens och berggrundens sammansättning." Ground gravity measurements (a Bouguer
  anomaly map, RG82, in mGal, from SGU, Lantmäteriet and other organisations), an interpolated
  overview grid, and airborne gravity and gradiometry around Kiruna.
