id: azu/data-room
title: Data Room of the Croatian Hydrocarbon Agency
summary: >-
  A centralized reference database for the assessment of hydrocarbon resources, geothermal water for
  energy purposes and geological structures for natural gas storage and permanent CO2 disposal. All
  seismic (2D and 3D) and basic well data are loaded into three Kingdom projects (Adriatic Sea,
  Pannonian Basin, Dinarides); other well data (reports, well logs, velocity measurements) are in a
  web browser as .pdf and .tif. Used physically or virtually after an access form.
