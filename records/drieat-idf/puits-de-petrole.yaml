id: drieat-idf/puits-de-petrole
title: Puits de pétrole en Ile-de-France (DRIEAT)
summary: >-
  "Puits de pétrole en Ile-de-France": point locations of oil wells in Île-de-France with the
  regional and national well numbers (NoDRIRE, NOSCG), well name (e.g. BECHEVRET 001), well state
  and permit number, as a shapefile download with WMS and WFS services.
