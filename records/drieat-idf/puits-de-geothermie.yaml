id: drieat-idf/puits-de-geothermie
title: Puits de géothermie (DRIEAT Île-de-France)
summary: >-
  "Localisation des têtes et impacts des puits géothermiques en Île-de-France": well heads and
  reservoir impacts of geothermal wells in Île-de-France, with site, well name, function
  (production, injection, plugged, unused), aquifer (Dogger on 223 of 295 points, also Yprésien, Craie, Albien, Lutétien, Néocomien), doublet or triplet type and history, "générés … à partir des
  coordonnées cartographiques mentionnées dans les déclarations ou demandes d’autorisation instruites
  par le Pôle Sous-Sol".
publisher: {name: "Direction régionale et interdépartementale de l’environnement, de l’aménagement et des transports d'Île-de-France (DRIEAT)", url: https://www.data.gouv.fr/organizations/direction-regionale-et-interdepartementale-de-lenvironnement-de-lamenagement-et-des-transports-dile-de-france, country: FR}
origin:
  url: https://www.data.gouv.fr/datasets/puits-de-geothermie-1
  access: anonymous
  manifest_url: https://www.data.gouv.fr/api/1/datasets/6835e20db63a9d35e7858995/
  notes: "data.gouv.fr record harvested from the geo-ide catalogue; the Atom download is a 23,897-byte shapefile zip of 295 points (L_GTH_PUITS_P_R11, RGF93 / Lambert 93) on 23 Oct 2026. WMS and WFS endpoints are listed too."
licence:
  name: Licence Ouverte / Open Licence Version 2.0
  spdx: etalab-2.0
  url: https://www.etalab.gouv.fr/wp-content/uploads/2017/04/ETALAB-Licence-Ouverte-v2.0.pdf
  redistribution: allowed
  attribution: required
kinds: [wellbore-headers]
region: {country: FR, basin: "Île-de-France", bbox: [1.44728482, 48.1205368, 3.55654097, 49.23738098], crs: "EPSG:2154"}
listed_by: [publisher]
known_issues:
  - "Point positions of well heads ('Tete') and reservoir impacts ('Impact'), not trajectories or logs."
  - "The bbox is the data.gouv.fr spatial extent of the record (the Île-de-France region)."
notes: "No period stated: the metadata dates the dataset 2019-07-25 (creation and last revision), not the wells."
added: 2026-10-23
