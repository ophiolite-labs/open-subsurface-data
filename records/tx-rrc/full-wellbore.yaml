id: tx-rrc/full-wellbore
title: Full Wellbore (Railroad Commission of Texas)
summary: >-
  Dump of the RRC Wellbore database. Records for each hole drilled are set up by API number and contain completion, plugging, formation and other information related to the well bore; information on most of the wells ever drilled in Texas is contained in the Full Well Bore file.
