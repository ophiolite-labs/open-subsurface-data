  notes: "Linked as \"WYDE (Data Explorer)\" from https://wogcc.wyo.gov/. The viewer's layer list is at /api/GISConfig and its layers are served through /geoserver/wfs; it also has a login for other functions. The older Data Site pipeline.wyo.gov disallows all crawling in robots.txt."
