id: wogcc/wyde-wells
title: WOGCC Data Explorer (WYDE)
summary: >-
  The Wyoming Oil and Gas Conservation Commission's web data explorer, a map viewer over the
  Commission's well database with layers for oil, gas, coalbed methane, injection, disposal and
  orphan wells, active and other permits to drill (APDs), oil and gas fields and gas plants.
