id: idaho-ogcc/well-files
title: Well & Facilities Files (Idaho Oil and Gas Conservation Commission)
summary: >-
  The Idaho OGCC's well and facility files, one page per well by county and US well number (Bonneville,
  Canyon and Payette counties; 34 wells) and for two facilities, and "LAS files for wells drilled 2007 and
  later that are available for release" in one compressed zip file.
