  notes: "The page links LASFiles.zip on gis1.idl.idaho.gov (36,017,299 bytes, Last-Modified 16 Apr 2026, on 23 Oct 2026) and one page per well with its documents. The Data Explorer (https://welldata.ogcc.idaho.gov/) searches and downloads well information; wells drilled before 2007 are on the Idaho Geological Survey interactive map."
