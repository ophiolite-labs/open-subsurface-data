id: soton/scanner-pockmark-velocity-models
title: Scanner-Pockmark Subsurface Velocity Models
summary: >-
  P-wave velocity models derived from seismic data acquired over the Scanner Pockmark complex in the
  North Sea: two full waveform inversion (FWI) models made with in-house tools from Shell and Imperial
  College, in binary and SEG-Y, and a tomographic model made with the open-source FAST code, in binary.
