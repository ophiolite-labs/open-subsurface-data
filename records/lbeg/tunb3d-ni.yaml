id: lbeg/tunb3d-ni
title: Tieferer Untergrund Norddeutsches Becken für Niedersachsen und Bremen (TUNB3D-NI, 2022)
summary: >-
  LBEG's geological 3D overview model of the deep subsurface of the North German Basin for Lower
  Saxony and Bremen, built 2014 to 2020 with BGR and the northern German state surveys and revised
  to the March 2022 version: 13 base surfaces of lithostratigraphic units from Zechstein to
  Tertiary plus Top Zechstein, 1592 faults, 2091 fault offsets at Base Zechstein and 130 salt
  structures, in 20 harmonised model tiles.
