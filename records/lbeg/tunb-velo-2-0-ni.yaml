id: lbeg/tunb-velo-2-0-ni
title: Geschwindigkeitsmodell des Norddeutschen Beckens für Niedersachsen und Bremen (TUNB Velo 2.0-NI, 2026)
summary: >-
  LBEG's 3D velocity model of the North German Basin for Lower Saxony and Bremen from the joint
  project TUNB Velo 2.0 led by BGR: regional interval velocities from Base Zechstein to the ground
  surface, built on 14 lithostratigraphic horizons, salt structures and faults mostly from
  TUNB3D-NI, in 19 harmonised model tiles, as a basis for time-depth conversion of seismic data.
