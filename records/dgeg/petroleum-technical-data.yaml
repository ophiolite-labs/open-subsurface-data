id: dgeg/petroleum-technical-data
title: "Petróleo: Dados / Informação Técnico-Científica (seismic, wells and reports of Portugal)"
summary: >-
  The technical data from petroleum exploration in Portugal held by DGEG and LNEG: about
  72,600 km of 2D seismic (field, processed and reprocessed; 5,865 km onshore, 67,009 km
  offshore), about 10,372 km² of 3D seismic acquired since 2010, and 175 wells drilled since 1938
  with final reports, electric logs, velocity data, geochemistry and biostratigraphy reports,
  cores and cuttings, thin sections and fluid samples.
