id: gsmma/hydrogeological-drilling-database
title: "水文地質鑽探資料庫 (Hydrogeological drilling database)"
summary: >-
  Geological drilling base data, core records and geophysical well logs from Taiwan's
  hydrogeological drilling programme: well location (TWD97 coordinates, site), core lithology by
  depth, and logs of spontaneous potential, 16-inch and 64-inch resistivity and natural gamma.
