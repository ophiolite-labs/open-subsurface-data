id: gsni/tellus-airborne-magnetics
title: GSNI Tellus Regional Airborne Geophysical Survey - Magnetics
summary: >-
  "This dataset presents the results of the Tellus Magnetic data as xyz data": total magnetic
  intensity, base-station correction, perpendicular gradient, microlevelled field, IGRF and
  magnetic anomaly, with grid and WGS84 positions, flight, altitude and terrain channels. Flown
  over "the whole of Northern Ireland" in 2005 and 2006; "82,000 line-km of data were acquired."
