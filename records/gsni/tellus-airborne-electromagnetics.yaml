known_issues:
  - "No extent is stated on the page (\"the whole of Northern Ireland\" only); bbox left out."
  - "The page's licence label is 'UK Open Government Licence (OGL)' and links version 3; spdx follows the link."
  - "Low and high frequencies differ between the 2005 and 2006 flights (3125/14368 Hz and 3005/11962 Hz), as the channel list states."
