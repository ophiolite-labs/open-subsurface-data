id: gsni/tellus-airborne-electromagnetics
title: GSNI Tellus Regional Airborne Geophysical Survey - Electromagnetics
summary: >-
  "This dataset presents the results of the Tellus Electromagnetic data as xyz data": in-phase and
  quadrature components, apparent resistivity and apparent depth at a low and a high frequency, with
  grid and WGS84 positions, flight, altitude and terrain channels. "An airborne geophysical survey of
  the whole of Northern Ireland was flown by the Geological Survey of Northern Ireland in 2005 and
  2006"; "In total, 82,000 line-km of data were acquired."
publisher: {name: Geological Survey of Northern Ireland, url: https://admin.opendatani.gov.uk, country: GB}
origin:
  url: https://admin.opendatani.gov.uk/dataset/gsni-tellus-regional-airborne-geophysical-survey-electromagnetics
  access: anonymous
  manifest_url: https://admin.opendatani.gov.uk/dataset/gsni-tellus-regional-airborne-geophysical-survey-electromagnetics
  notes: "Open Data NI (CKAN) page of the GSNI, which is \"part of the Department for the Economy (DfE)\" and \"staffed by scientists of the British Geological Survey (BGS)\". The page links one zip on resources.bgs.ac.uk: Electromagnetics.zip, 383,666,252 bytes on 24 Oct 2026. Survey, processing and data conditioning are described in BGS reports IR/06/136 and IR/06/032 (nora.nerc.ac.uk)."
