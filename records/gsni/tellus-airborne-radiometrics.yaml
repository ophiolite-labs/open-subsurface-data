id: gsni/tellus-airborne-radiometrics
title: GSNI Tellus Regional Airborne Geophysical Survey - Radiometrics
summary: >-
  "This dataset presents the results of the Tellus Radiometric survey as xyz data": total counts,
  air absorbed dose rate, potassium, uranium and thorium, with grid and WGS84 positions, flight,
  altitude, temperature and terrain channels. "An airborne geophysical survey of the whole of
  Northern Ireland was flown by the Geological Survey of Northern Ireland in 2005 and 2006" at
  "200 m line spacing and a flying height of 56 m (240 m over built-up areas)".
