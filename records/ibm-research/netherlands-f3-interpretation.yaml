id: ibm-research/netherlands-f3-interpretation
title: Netherlands F3 Interpretation Dataset
summary: >-
  Reinterpretation of the public Netherlands F3 post-stack seismic for machine learning: nine
  horizons separating seismic facies intervals, used to create 651 labelled masks for inlines and
  951 for crosslines, with the inline and crossline sections, masks and training tiles in ten classes.
