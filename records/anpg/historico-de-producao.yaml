  - "Terms: 'Este website destina-se exclusivamente a fins informativos' and 'Todos os conteúdos deste website ... são propriedade da ANPG ou dos seus licenciadores'; footer 'Todos os direitos reservados'. No licence for the data is named."
  - "National totals only, not by field or well; the API has no download file, so there is no listing to sample."
  - "bbox is Angola with its offshore, approximate."
