id: anpg/historico-de-producao
title: Histórico de Produção (annual crude oil production of Angola)
summary: >-
  ANPG's production history page for Angola: annual national crude oil production in barrels per day
  from 1955 to 2025, sourced "ANPG - Direcção de Produção", shown with milestones, decade averages and
  monthly oil and associated gas figures for 2024 to 2025.
publisher: {name: "Agência Nacional de Petróleo, Gás e Biocombustíveis (ANPG)", url: https://www.anpg.co.ao, country: AO}
