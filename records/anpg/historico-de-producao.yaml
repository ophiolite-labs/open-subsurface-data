  url: https://www.anpg.co.ao/producao/historico
  access: anonymous
  manifest_url: https://www.anpg.co.ao/api/production-historical
  notes: "The page is script-rendered; its annual series is served as JSON by the site's own API at https://www.anpg.co.ao/api/production-historical (71 rows, fields year, oil_bopd, source). The linked PDF 'Histórico de Produção 1956-2020' has a malformed address and answered 403."
