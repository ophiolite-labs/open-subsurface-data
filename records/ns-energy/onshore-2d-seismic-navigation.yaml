id: ns-energy/onshore-2d-seismic-navigation
title: Navigation data for 2D seismic lines, onshore Nova Scotia (NSDOE Open File Report 2017-11)
summary: >-
  Shapefiles of the navigation (shot-point locations) of onshore 2D seismic lines in Nova Scotia,
  in three zip archives for the Cape Breton, Cumberland and Windsor regions, published with the
  Nova Scotia Onshore Petroleum Atlas (2017) beside the Schedule of 2D Seismic Data (OFR 2017-07).
publisher: {name: Nova Scotia Department of Energy, url: https://novascotia.ca/onshore-atlas/, country: CA}
