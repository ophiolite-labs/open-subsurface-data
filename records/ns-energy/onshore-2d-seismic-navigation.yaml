  manifest_url: https://novascotia.ca/onshore-atlas/
  notes: "Zips under https://novascotia.ca/onshore-atlas/docs/, e.g. Part 2 Cumberland region 1,954,295 bytes. Seismic traces are not on this page; the Onshore Petroleum Data Viewer links 2D and 3D seismic datasets."
