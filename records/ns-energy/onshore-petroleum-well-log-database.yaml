  manifest_url: https://novascotia.ca/onshore-atlas/
  notes: "Zips under https://novascotia.ca/onshore-atlas/docs/: Part 1 Cape Breton 4,837,104 bytes, Part 2 Cumberland 16,150,885 bytes, Part 3 Windsor 44,392,798 bytes. The page also points to the Nova Scotia Onshore Petroleum Data Viewer (an ArcGIS Experience) for well, 2D and 3D seismic and geologic model downloads."
