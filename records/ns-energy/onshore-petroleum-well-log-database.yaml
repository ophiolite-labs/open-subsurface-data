id: ns-energy/onshore-petroleum-well-log-database
title: Preliminary petroleum well log database, onshore Nova Scotia (NSDOE Open File Report 2017-09)
summary: >-
  Well logs from onshore petroleum wells in Nova Scotia as LAS files, in three zip archives for
  the Cape Breton, Cumberland and Windsor regions, published with the Nova Scotia Onshore
  Petroleum Atlas (2017) beside the Schedule of Petroleum Wells and a preliminary petrophysics
  database.
