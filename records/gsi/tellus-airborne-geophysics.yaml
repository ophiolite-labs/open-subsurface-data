id: gsi/tellus-airborne-geophysics
title: Tellus airborne geophysical data (magnetic, radiometric and electromagnetic)
summary: >-
  "Geophysical data and maps include data from the Tellus project (magnetic, electromagnetic,
  radiometric data) and other sources." Airborne surveys at "a nominal survey altitude of 60m and a
  line spacing of 200m"; "Data are available in merged packages of all the Tellus phases or
  individually as survey blocks are completed."
