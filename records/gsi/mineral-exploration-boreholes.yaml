title: Mineral Exploration Boreholes
summary: >-
  "These boreholes were drilled to find minerals, oil, gas, water or to find out more about geology.
  The data shows the location of the boreholes drilled in Ireland from 1957 to 2002. They were
  submitted to the GSI from mineral exploration companies."
