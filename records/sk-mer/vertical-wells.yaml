  access: anonymous
  manifest_url: https://gis.saskatchewan.ca/arcgis/rest/services/Economy/Petroleum/MapServer/0?f=json
  notes: "Layer 0 of the Economy/Petroleum map service (\"All feature classes from the PETROLEUM schema in the Production Data Warehouse\"), 119,595 features, maxRecordCount 2000. Non-vertical wells are layer 1, drill core layer 2, drill cuttings layer 3."
