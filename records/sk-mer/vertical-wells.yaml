id: sk-mer/vertical-wells
title: Vertical Wells (Saskatchewan PETROLEUM schema, GeoAtlas)
summary: >-
  Locations of vertical wells licensed under The Oil and Gas Conservation Act and Regulations and
  The Oil and Gas Conservation Regulations 2012 across Saskatchewan, with surface and bottom-hole
  positions taken from survey plans entered into the Ministry's IRIS system, licence, status,
  Lahee classification, spud, finish-drill and abandonment dates and wellbore depths.
publisher: {name: "Government of Saskatchewan, Ministry of Energy and Resources", url: https://www.saskatchewan.ca, country: CA}
origin:
