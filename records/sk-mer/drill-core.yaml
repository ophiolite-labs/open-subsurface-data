id: sk-mer/drill-core
title: Drill Core (Saskatchewan PETROLEUM schema, GeoAtlas)
summary: >-
  "Locations of Phanerozoic Basin wells with cored intervals stored at the Subsurface Lab in Regina."
  Each cored interval carries the well UWI and licence, surface and bottom-hole positions, interval
  top and base, core and box numbers, core type, slab type and whether it was analysed.
publisher: {name: "Government of Saskatchewan, Ministry of Energy and Resources", url: https://www.saskatchewan.ca, country: CA}
origin:
  url: https://gisappl.saskatchewan.ca/WebDocs/Geo_Atlas/MetaData/Drill_Core.html
  access: anonymous
  manifest_url: https://gis.saskatchewan.ca/arcgis/rest/services/Economy/Petroleum/MapServer/2?f=json
  notes: "Layer 2 of the Economy/Petroleum map service; 104,754 cored intervals on 23 Oct 2026 (the 2019 metadata says 71,469), maxRecordCount 2000."
licence:
  name: Government of Saskatchewan Standard Unrestricted Use Data Licence (Version 2.0)
  spdx: null
  url: https://gisappl.saskatchewan.ca/Html5Ext/Resources/GOS_Standard_Unrestricted_Use_Data_Licence_v2.0.pdf
  redistribution: allowed
  attribution: required
  statement: "Contains information licensed under the Government of Saskatchewan Standard Unrestricted Use Data Licence (Version 2.0)."
kinds: [core]
region: {country: CA, basin: Western Canada Sedimentary Basin and Williston Basin (Saskatchewan), bbox: [-110.983154, 48.897292, -100.591470, 57.404270]}
listed_by: [publisher]
known_issues:
  - "An inventory of cored intervals held at the Subsurface Geological Laboratory, not core measurements; the metadata page itself carries only a use disclaimer, the licence is the GeoAtlas data licence."
  - "The map service caps a query at 2000 features; a full copy takes paged queries."
added: 2026-10-23
