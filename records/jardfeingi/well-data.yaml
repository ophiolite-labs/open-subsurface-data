id: jardfeingi/well-data
title: Boridátur (well data releases, Faroe Islands)
summary: >-
  Jarðfeingi's overview of the data releases for all wells on the Faroese map, 9 offshore wells
  and 3 onshore wells: per well a PDF of well information (location, datum, depths, spud and
  completion dates, licence, operator) and lists of the released analog logs, digital logs (LAS)
  and reports, with zip files of the offshore and onshore well locations.
