id: wvges/pipeline-oil-and-gas-well-data
title: "WVGES Oil and Gas Well Data (\"Pipeline\", scanned and digitized logs)"
summary: >-
  The West Virginia Geological and Economic Survey's oil and gas well data for over 154,000
  wells: locations, completions, operators, pays and shows, formation tops and thicknesses,
  monthly and annual production generally since 1979, plugging, logs and samples, searched one
  well at a time in "Pipeline" and "Pipeline-Plus", with file repositories of scanned well logs,
  digitized LAS logs and scanned well records.
publisher: {name: West Virginia Geological and Economic Survey (WVGES), url: https://www.wvgs.wvnet.edu, country: US}
