  url: https://www.wvgs.wvnet.edu/www/datastat/datastat.htm
  access: anonymous
  notes: "Repositories http://downloads.wvgs.wvnet.edu/welllogs/, http://downloads.wvgs.wvnet.edu/diglogs/ and http://downloads.wvgs.wvnet.edu/BatchInfo/; Pipeline https://www.wvgs.wvnet.edu/oginfo/pipeline/pipeline2_intro.asp. The well data DVD and the Atlas of Major Appalachian Gas Plays database are ordered separately."
