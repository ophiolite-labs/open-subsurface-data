  The location of offshore wells drilled in the Irish offshore area (Irish EEZ, Irish Sea, Saint Georges Channel, Celtic Sea and North Atlantic) between 1970 and 2019 by commercial oil and gas exploration companies, provided by the Petroleum Affairs Division. Point data as CSV, KML and shapefile.
