id: pau/petroleum-data
title: Uganda petroleum data (Petroleum Authority of Uganda data management)
summary: >-
  The Petroleum Authority of Uganda manages all the petroleum and related data generated from oil and gas
  activities in Uganda and assesses and responds to requests for data: geological and geophysical
  subsurface data, essentially wells and seismic data, facilities, HSE, costs, national content and GIS
  data, held in a tier three data centre, a core store and seismic tape storage.
