title: PERUPETRO Data Bank Portal (Banco de Datos)
summary: >-
  PERUPETRO S.A.'s Data Bank Portal for Peru's hydrocarbon exploration and production information
  from various sources, offered to interested companies for their own research and evaluation: the
  data bank, a Geoportal, promotional packages and areas, and block data rooms (Block Z-69, Block
  207, Northwest Block).
