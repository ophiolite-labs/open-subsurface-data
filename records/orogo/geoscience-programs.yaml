id: orogo/geoscience-programs
title: Geoscience Data (OROGO geoscience programs, Northwest Territories)
summary: >-
  "This page gives access to the results of geoscience programs carried out in OROGO’s jurisdiction
  between 1943 and 2013 (no programs have been carried out since then). Geoscience programs cover all
  non-drilling oil and gas research and include seismic programs, geological field research,
  aeromagnetic surveys, and more."
