id: orogo/well-data
title: Well Data (OROGO, Northwest Territories)
summary: >-
  OROGO's list of wells in its jurisdiction, the Northwest Territories outside federal areas and the
  Inuvialuit Settlement Region: each well page gives operator, classification, region, first spud
  year, latest spud and rig release dates, UWI and the well history documents as PDF.
publisher: {name: "Office of the Regulator of Oil and Gas Operations (OROGO), Northwest Territories", url: https://www.orogo.gov.nt.ca, country: CA}
