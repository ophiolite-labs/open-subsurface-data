  url: https://www.orogo.gov.nt.ca/en/well-data
  access: anonymous
  notes: "685 wells listed on 23 Oct 2026, filterable by operator, classification (Exploratory 595, Development 33, Delineation 29, Test Hole 24, Water Well 3, Service Well 1) and region (Dehcho 453, Sahtu 191, Gwich'in 41). No manifest_url: the list links well pages, not files."
