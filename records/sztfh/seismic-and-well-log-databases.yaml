id: sztfh/seismic-and-well-log-databases
title: Seismic and borehole geophysics databases of the Hungarian State Geological, Geophysical and Mining Data Repository
summary: >-
  The seismic database holds field and processed data of 2D and 3D seismic surveys carried out in
  Hungary, regardless of contractor or purpose, in SEGY and SEGD; the borehole geophysics database
  holds well logs as LAS files, about 7200 objects informative for hydrocarbon exploration, 1700 of
  them digital. Copies are released by the Repository (Adattár) for a fee.
