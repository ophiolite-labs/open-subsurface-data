id: liag/geotis
title: GeotIS – Geothermisches Informationssystem für Deutschland
summary: >-
  Germany's geothermal information system: "Datengrundlage für das GeotIS sind zum Einen mehr als
  30.000 Bohrungen; das sind überwiegend Erdöl-Erdgas-Bohrungen", with hydraulic data (porosity,
  permeability, tests), temperature data from LIAG's FIS Geophysik and structural data, prepared as
  3D subsurface models with vertical and horizontal sections to 5000 m below sea level.
