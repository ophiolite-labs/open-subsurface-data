  url: https://dataservices.gfz.de/10.5880/gfz.ktb.top/data-from-the-german-continental-deep-drilling
  access: anonymous
  notes: DOI 10.5880/gfz.ktb.top. The publication states the data are served from the original KTB site, https://data.icdp-online.org/sites/ktb/welcome.html.
