id: gfz/ktb-data
title: Data from the German Continental Deep Drilling Project (KTB)
summary: >-
  Digital access to data and publications of the KTB project in northeastern Bavaria: borehole measurements, lithological descriptions of cores and cuttings, geochemistry, petrophysics and rock mechanics from the KTB pilot hole (VB) and main hole (HB), ordered by discipline, well and working group.
