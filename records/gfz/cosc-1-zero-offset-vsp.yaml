id: gfz/cosc-1-zero-offset-vsp
title: Zero-offset vertical seismic profiling (VSP) data from the COSC-1 borehole, Sweden
summary: >-
  High-resolution zero-offset VSP recorded in 2014 in the ICDP COSC-1 borehole near Åre, central Sweden (Collisional Orogeny in the Scandinavian Caledonides), with 15 three-component borehole receivers at 2 m spacing over the whole borehole. Two data sets: the decoded, pre-processed three-component shot gather and the final-processed vertical-component shot gather.
