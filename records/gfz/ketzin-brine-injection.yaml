id: gfz/ketzin-brine-injection
title: Dataset of the Brine Injection at the CO2 Storage Pilot Site Ketzin, Germany
summary: >-
  Operational data (flow rate, cumulative mass, density, injection temperature, electrical conductivity and in-well pressure) recorded during a field experiment on brine injection at the Ketzin CO2 storage pilot site, where 67 kt of CO2 were injected into the Stuttgart Formation saline aquifer (630 m to 650 m) between June 2008 and August 2013.
