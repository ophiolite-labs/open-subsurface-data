id: gfz/dekorp-9n-reprocessed
title: Reprocessed deep seismic reflection profile DEKORP 1988-9N (Northern Upper Rhine Graben)
summary: >-
  The DEKORP profile 9N, recorded in 1988 by the German deep seismic reflection program, reprocessed on behalf of the Hessian Agency of Nature Conservation, Environment and Geology (HLNUG) to image structures down to about 6 km (3 s TWT). Trace data in SEG-Y.
