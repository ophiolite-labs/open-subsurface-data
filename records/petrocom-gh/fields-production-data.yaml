id: petrocom-gh/fields-production-data
title: Fields Production Data (Production Volume)
summary: >-
  The Petroleum Commission's monthly production by field for Jubilee, TEN and OCTP / Sankofa-Gye
  Nyame: oil production (bbl/d), gas production, gas re-injected, fuel gas, flared gas and gas
  exported to GNGC (MMscf/d), with liftings by lifting party. Yearly workbooks "2025 Fields
  Production Data" and "2024 Fields Production Data" are offered for download.
