known_issues:
  - "cgs.gov.cz/copyright: \"Jejich využívání nebo reprodukce je možná pouze s písemným souhlasem České geologické služby.\" The CC BY 4.0 there covers INSPIRE download datasets only, not this service."
  - "The layer gives basic data per object (depth, coordinates, rock, stratigraphy, purpose, year, flags for logging and hydrogeology); profiles and logs are in the paid GDO database."
  - "The GDO database lags the archive by about four years (publisher's notice). www.geology.cz timed out on 23 Oct 2026; cgs.gov.cz and mapy.geology.cz answer. bbox is the Czech Republic, approximate."
notes: "Layer 1 (Vrty) of the Vrtna_prozkoumanost map service, copyright text \"© ČGS\", 746,789 features and maxRecordCount 3000 on 23 Oct 2026. The GDO database covers about 720 thousand objects including about 620 thousand geological borehole profiles."
