id: cgs/vrtna-prozkoumanost
title: Vrtná prozkoumanost (boreholes and other documented objects of the Czech Republic)
summary: >-
  The Czech Geological Survey keeps databases of objects (boreholes, wells, dug pits, springs) taken
  from reports deposited by law in the Geofond archive. Basic data on boreholes and other works in the
  database of geologically documented objects (GDO) can be viewed free in the map application and its
  ArcGIS map service; complete GDO extracts (profiles, hydrogeology, logging) are paid data outputs.
