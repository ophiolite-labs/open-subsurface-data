id: co2datashare/sleipner-2019-benchmark-model
title: Sleipner 2019 Benchmark Model
summary: >-
  A reference model of the Sleipner CO2 storage site (Utsira Formation): simulation grid in ECLIPSE and RESCUE formats with petrophysical properties, wells 15/9-A-16 and 15/9-13, CO2 plume outlines per sandstone layer, feeders, velocity maps and depth horizons, released January 2020 by Equinor.
