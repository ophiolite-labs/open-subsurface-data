id: co2datashare/eos-31-5-7-thermo-mechanical
title: Rock mechanics data for 31/5-7 Eos well - thermo-mechanical response
summary: >-
  "Part II of a rock mechanical testing program performed by NGI for Northern Lights JV DA on sandstone
  and shale from CCS exploration well 31/5-7 (Eos) in EL 001", addressing "the thermo-mechanical
  response of the reservoir and caprock to CO2 injection": Cook, Johansen 3 and 4 sandstones and
  Intra-Drake shale tested close to in-situ temperatures, as spreadsheets with figures and photos.
