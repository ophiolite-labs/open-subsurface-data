id: co2datashare/eos-31-5-7-rock-mechanics
title: Rock mechanics data for 31/5-7 Eos well core
summary: >-
  Results of a rock mechanical testing programme performed by NGI for Equinor on sandstone and shale core from CCS exploration well 31/5-7 (Eos) in EL 001 (Northern Lights): triaxial, hydrostatic, uniaxial and Brazilian tests on Cook and Johansen sandstones and permeability and undrained triaxial tests on Intra-Drake shale, as spreadsheets with figures and sample photos.
