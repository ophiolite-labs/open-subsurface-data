id: co2datashare/svelvik-cross-well-2019
title: Svelvik CO2 Field Lab cross-well data 2019
summary: >-
  "This data set was acquired during the Pre-ACT project at the Svelvik CO2 Field Laboratory to develop
  and test methods for CO2 monitoring. It includes cross-well seismic measurements taken before, during,
  and after the CO2 injection", as seismic data in sg2 format with survey records, acquisition
  geometries and documentation.
