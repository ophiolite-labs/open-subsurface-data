id: co2datashare/illinois-basin-decatur
title: Illinois Basin - Decatur Project Dataset
summary: >-
  Reference dataset containing subsurface data, monitoring data, geomodels, geomechanical data and reports related to assessment and CO2 injection at the Archer Daniels Midland site in Decatur, Illinois: a high-resolution 3D seismic survey, time-lapse VSP, an induced microseismicity catalogue, well information for CCS1, VW1 and GM1, Petrel horizons and faults, and the final Petrel static model.
