id: co2datashare/smeaheia
title: Smeaheia Dataset
summary: >-
  Reference dataset for the proposed Smeaheia CO2 storage site on the Hordaland Platform offshore Norway: 2D and 3D seismic (GN1101, TNE01), well logs and reports for wells 32/2-1 and 32/4-1, fault sticks, horizons, surfaces, velocity maps, rock mechanics data and reservoir simulation models. Released by Gassnova and Equinor in February 2021.
