id: miterd/sondeos-hidrocarburos
title: Dominio Minero de Hidrocarburos y Sondeos de España
summary: >-
  "Conjunto de datos de localización de Permisos de Investigación y Concesiones de Explotación
  activos así como de campañas sísmicas y sondeos de hidrocarburos en España": hydrocarbon
  exploration permits and production concessions, seismic campaigns and hydrocarbon wells, state
  and regional, served by the ministry's WMS and WFS (layers permisos, sondeos, lineasSismicas,
  lineasSismicas3d).
