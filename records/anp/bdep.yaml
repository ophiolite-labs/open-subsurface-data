id: anp/bdep
title: Banco de Dados de Exploração e Produção (BDEP)
summary: >-
  ANP's exploration and production database for the Brazilian sedimentary basins, run by the Superintendência de Dados Técnicos. Public (non-exclusive) technical data are open to anyone as paying occasional or associated clients, or free to non-profit research institutions; onshore public data (REATE) and a selection of offshore post-stack data (PROMAR) are free.
publisher: {name: "Agência Nacional do Petróleo, Gás Natural e Biocombustíveis (ANP)", url: https://www.gov.br/anp, country: BR}
