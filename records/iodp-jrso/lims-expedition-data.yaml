id: iodp-jrso/lims-expedition-data
title: IODP JOIDES Resolution expedition core data (LIMS, Expeditions 317–403)
summary: >-
  Shipboard core data from JOIDES Resolution expeditions held in the Laboratory Information Management System (LIMS) of the IODP JOIDES Resolution Science Operator at Texas A&M University: core and section summaries, core images, physical properties (GRA bulk density, magnetic susceptibility, thermal conductivity, formation temperature), paleomagnetism and chemistry (ICP-AES, ion chromatography, carbonates), with per-expedition data packages on Zenodo.
publisher: {name: "IODP JOIDES Resolution Science Operator (JRSO), Texas A&M University", url: https://iodp.tamu.edu, country: US}
origin:
  url: https://iodp.tamu.edu/database/zenodo.html
  access: anonymous
  notes: "The JRSO page 'Data Available in Zenodo' links each expedition's data in the Zenodo IODP community (https://zenodo.org/communities/iodp). The live LIMS portal is https://web.iodp.tamu.edu/LORE/ (guest login, no account). Older DSDP/ODP data are in the Janus database."
licence:
  name: "Stated per Zenodo deposit: Creative Commons Attribution 4.0 International or Creative Commons Zero v1.0 Universal"
  spdx: null
  url: https://iodp.tamu.edu/about/copyright.html
  redistribution: allowed
  attribution: required
kinds: [core, geochemistry]
region: {basin: "Global ocean basins (JOIDES Resolution drill sites)"}
listed_by: [publisher]
known_issues:
  - "Licence is per deposit: of 'IODP Expedition ...' deposits listed on 23 Oct 2026, 2295 state CC BY 4.0 and 689 CC0 (one listing page of 25 failed to load). The JRSO Licensing Statement names CC BY 4.0 for photos and publications only, and a one-year moratorium for new data."
  - "The LORE portal itself states no licence. No bbox: sites span all ocean basins."
period:
  start: "2009"
  end: "2024"
  stated: "JRSO Data Overview page: 'IODP Expeditions 317–403 (LIMS; 2009–2024)'; JRSO expeditions page: 317 'Nov 2009–Jan 2010', 403 'June–August 2024'"
notes: "No bbox: a global repository; the drill sites are in all ocean basins."
added: 2026-10-23
