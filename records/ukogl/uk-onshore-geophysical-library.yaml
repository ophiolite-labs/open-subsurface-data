id: ukogl/uk-onshore-geophysical-library
title: UK Onshore Geophysical Library (UKOGL)
summary: >-
  A charitable national collection of UK onshore exploration data: over 87,000 km of 2D and more than 2,900 sq km of 3D seismic (post-stack SEG-Y, images, navigation), pre-stack field data for output costs, well data with tops, reports, LAS logs and directional data, and BGS and Mining Remediation Authority seismic, through an interactive web map.
