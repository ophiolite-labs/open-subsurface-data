id: kigam/coastal-marine-geological-map-gangneung-samcheok
title: "수치연안해저지질도 1집(10만, 강릉삼척해역) (Digital coastal marine geological map 1, 1:100,000, Gangneung-Samcheok)"
summary: >-
  GIS build of "대한민국 연안해저지질도 제1집(2019, 강릉-삼척, 1:100,000)" on KIGAM's Geo Big Data Open
  Platform (Petroleum & Marine subject): eight sheets, among them bathymetry with sampling points
  and survey lines, surface sediment grain size and type, seabed sound velocity, sediment
  isopach, gravity anomaly (중력이상분포도), magnetic anomaly (자력이상분포도) and surface sediment
  rare-earth elements.
