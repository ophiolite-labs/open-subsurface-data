id: ga/l016-rough-range-1-velocity-survey
title: L016 Seismic velocity survey in Rough Range No.1 well, WA, 1955
summary: >-
  "At the request of West Australian Petroleum Pty. Ltd. and the Department of Mines, Western
  Australia, the Bureau carried out a seismic velocity survey in Rough Range No.1 Well, with the
  object of obtaining velocity distribution data for use in the interpretation of results of seismic
  refraction surveys in the area." Geophone depths 2,000 to 14,000 feet.
