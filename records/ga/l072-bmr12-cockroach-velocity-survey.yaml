id: ga/l072-bmr12-cockroach-velocity-survey
title: L072 BMR 12 (Cockroach) well seismic velocity survey, NT, 1964
summary: >-
  "In November 1964, the Bureau of Mineral Resources Seismic Party No. 1 carried out a velocity
  survey in CBMR 12 (Cockroach) Well, Northern Territory, which had been drilled to 4000 feet and
  logged using sonic and other logging methods. The time/depth values obtained in the velocity
  survey were in good agreement with those obtained by integration of the sonic log."
