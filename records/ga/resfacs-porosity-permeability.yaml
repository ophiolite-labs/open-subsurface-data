id: ga/resfacs-porosity-permeability
title: Collection of porosity and permeability data from petroleum wells (known as RESFACS database/ Porosity and Permeability)
summary: >-
  Part of Geoscience Australia's Reservoir, Facies and Shows (RESFACS) database, "which contains
  depth-based information regarding porosity and permeability measured or interpreted from core,
  sidewall core and well-log analysis of rocks intersected by offshore petroleum wells."
