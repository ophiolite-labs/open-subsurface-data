  notes: "eCat 10ac40b7-844c-4ea2-bd84-23eaadfa4e77, DOI 10.26186/146442. Served as layer resfacs:Biostratigraphy of the WFS https://services.ga.gov.au/gis/resfacs/ows and through https://portal.ga.gov.au/. The manifest_url is a WFS 2.0.0 GetFeature of the first 1,000 of 50,128 resfacs:Biostratigraphy samples (numberMatched on 24 Oct 2026), GeoJSON."
