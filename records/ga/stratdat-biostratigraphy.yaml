id: ga/stratdat-biostratigraphy
title: Collection of biostratigraphic data from petroleum wells (known as STRATDAT database)
summary: >-
  "Geoscience Australia's biostratigraphic database (STRADAT) provides information about the
  biozonation of sedimentary rocks that were intersected by offshore petroleum wells." Data come
  from well completion reports and destructive analyses reports submitted under the OPGGSA 2006 and
  the PSLA 1967, and from GA, AGSO, BMR and state studies.
