id: ga/brumbys-1-otway
title: Brumbys 1 logs, geochemistry and foram dataset
summary: >-
  Brumbys 1 was an appraisal well drilled and cored through Brumbys Fault at the CO2CRC Otway International Test Centre in 2018. The dataset compiles analysis of the core: core log, foraminifera, palaeodepth, carbonate, XRF, ICP-MS, XRD, grain size, density, surface area and gamma, sampled at 1-2 m intervals.
