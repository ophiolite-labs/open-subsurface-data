known_issues:
  - "The page's licence label reads only 'Creative Commons 3.0' and links the BY-SA 3.0 deed; its survey description says Geoscience Australia releases the data under CC BY 3.0 AU. The label is recorded: it is the page's licence for this download, and the stricter one."
  - "CC BY 3.0 AU stays the licence of Geoscience Australia's original seismic: reuse credits Geoscience Australia as well as dGB. Redistribution and attribution read the same under either licence; only share_alike depends on the label."
  - "The page says the main download holds 'only full stack seismic and well tracks'; angle stacks are separate downloads. Well logs are named but not linked (NOPIMS has them); horizons are not stated, so neither is a kind here."
  - "bbox is approximate: it spans the page's coordinates (S 13°14' / E 122°12') and its map link (lat -13.63, lng 122.2) for the stated 3,376.71 sq km."
period:
  start: "2009"
  end: "2009"
  stated: "TerraNubis data info page, General block: 'Acquisition: 2009', '(Re)processing: 2009', 'Value added Products: 2017'"
notes: "TerraNubis's OpendTect repackaging of the survey recorded as nopims/poseidon (TGS's MDIO release on AWS Open Data, CC BY 4.0): same survey, different publisher, format and licence statement. Deposit (E41 design 6): a maintainer took Poseidon_3D.zip from the owner's download of 31 Oct 2026 for deposit; the deposit into the mirror is not yet made. No outline: the page gives a point and an area, not the survey's corners; the outline is derived from the archive by the pack lane."
