  OpendTect project with 3D seismic data, angle stacks and wells over the Poseidon 3D survey in the Browse Basin, NW Shelf of Australia.
  Original seismic from Geoscience Australia; angle stacks created by ConocoPhillips; OpendTect project by dGB Earth Sciences.
