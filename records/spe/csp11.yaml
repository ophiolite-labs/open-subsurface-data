id: spe/csp11
title: The 11th Society of Petroleum Engineers Comparative Solution Project (SPE11)
summary: >-
  A comparative solution project motivated by the simulation challenges of CO2 storage in
  geological settings, in three versions: 11A, a 2D laboratory-scale geometry; 11B, the same at
  field scale; and 11C, extruded to a full 3D field model. Geometries, input decks,
  thermodynamic and evaluation scripts are in the associated GitHub repository.
