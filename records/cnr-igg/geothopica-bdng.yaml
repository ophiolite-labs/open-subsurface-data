id: cnr-igg/geothopica-bdng
title: GeoThopica 2.0 – Banca Dati Nazionale Geotermica (BDNG)
summary: >-
  Italy's geothermal data infrastructure run by CNR-IGG. "Il cuore dell’infrastruttura dati italiani
  geotermici è la BDNG, che contiene principalmente i dati stratigrafici e termici del sottosuolo, i
  dati di interesse geotermico provenienti da sorgenti termali, manifestazioni gassose, pozzi e numerosi
  dati geochimici descritti nella letteratura scientifica", updated by the VIGOR and Atlante Geotermico
  del Mezzogiorno projects.
