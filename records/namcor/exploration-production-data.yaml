id: namcor/exploration-production-data
title: Technical Data (Namibian Exploration and Production data)
summary: >-
  NAMCOR is the custodian of all Namibian exploration and production data: seismic data, well
  data, engineering well reports, other exploration reports, and aeromagnetic and gravity data,
  with a core and drill cuttings store holding rock samples retrieved during petroleum
  exploration from 1960 to date. Data is offered to investors and operators.
