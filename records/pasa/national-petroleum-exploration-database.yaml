id: pasa/national-petroleum-exploration-database
title: Petroleum Exploration Data (national hydrocarbon exploration database of South Africa)
summary: >-
  Petroleum Agency SA archives and manages the national hydrocarbon exploration database on behalf
  of the State: data and reports from more than 300 offshore and some 200 onshore boreholes,
  2D and 3D seismic field and processed data, and cores, cuttings and samples held at the Cape
  Town core store. Data is browsed and ordered through a GeoTechnical Data Portal.
