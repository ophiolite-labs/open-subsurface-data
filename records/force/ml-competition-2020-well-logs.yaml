id: force/ml-competition-2020-well-logs
title: FORCE 2020 well log and lithofacies dataset for machine learning competition
summary: >-
  Well log dataset from 118 wells used in the FORCE 2020 machine learning competition to predict
  lithofacies: logs slightly cleaned up and partially despiked, with hand-crafted lithofacies and
  lithology interpretation, as LAS files for the train, test, blind and hidden wells, plus NPD
  lithostratigraphy (groups, formations and members) and casing depth tables.
