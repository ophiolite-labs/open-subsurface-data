id: sa-dem/moorari-3d-2005-reprocessing
title: 2005 Moorari 3D Seismic Survey Reprocessing
summary: >-
  Santos Ltd contracted WesternGeco to reprocess about 66 square kilometres of the 1994 Moorari 3D Seismic Survey in 2005/2006, to create Kirchhoff pre-stack time migrated gathers for AVO investigations and an enhanced stack for structural studies. Held in SARIG by the Geological Survey of South Australia.
