id: calgem/wellstar-oil-and-gas-wells
title: "WellSTAR: Oil and Gas Wells"
summary: >-
  Oil and gas wells in the Well Statewide Tracking and Reporting System (WellSTAR) of CalGEM, the
  Geologic Energy Management Division of the California Department of Conservation (formerly the
  Division of Oil, Gas, and Geothermal Resources), displayed by well type and well status, with
  CSV, shapefile, GeoJSON and KML downloads and an ArcGIS map service.
