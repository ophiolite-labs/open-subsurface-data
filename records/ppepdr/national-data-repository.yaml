id: ppepdr/national-data-repository
title: "PPEPDR: Pakistan Petroleum Exploration & Production Data Repository"
summary: >-
  "PPEPDR is Pakistan's centralized digital database for seismic, well, and physical petroleum data.
  It brings quality assured exploration and production information online so companies can review,
  select, and request data with less delay." Run for the Directorate General of Petroleum
  Concessions (DGPC) on PetroBank; subscribers view, select and download data online.
