id: jamstec/seismic-survey-database
title: JAMSTEC Seismic Survey Database
summary: >-
  Crustal structure data from JAMSTEC research programmes since 1997: multi-channel seismic
  reflection (MCS) and refraction and wide-angle reflection data by ocean bottom seismograph (OBS)
  around Japan and the western Pacific. All MCS and OBS data are available for academic use via a
  data request form.
