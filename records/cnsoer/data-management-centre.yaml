id: cnsoer/data-management-centre
title: CNSOER Digital Data Management Centre (DMC)
summary: >-
  The Canada-Nova Scotia Offshore Energy Regulator's Data Management Centre gives account
  holders access to non-confidential digital well and geological data and exclusive seismic
  data for the Nova Scotia offshore area; its public data summary lists the conventional and
  sidewall core, cuttings, slides and fluid samples held at the Information Management Centre.
publisher: {name: Canada-Nova Scotia Offshore Energy Regulator (CNSOER), url: https://cnsoer.ca, country: CA}
origin:
  url: https://cnsopbdigitaldata.ca/geoviewer/dmc
  access: request
  notes: "Account by application (https://cnsopbdigitaldata.ca/ixplor-admin/dmc/apply): \"Your application will be reviewed, and you will be notified by email\". Exclusive seismic data need acceptance of the Exclusive Seismic Data - Data Access & Confidentiality Agreement. Non-exclusive seismic data are excluded from the account."
licence:
  name: "DMC Terms and Conditions (no licence for the data stated)"
  spdx: null
  url: https://cnsopbdigitaldata.ca/ixplor-admin/dmc/apply
  redistribution: unknown
  attribution: unknown
kinds: [core, reports]
region: {country: CA, basin: Scotian Shelf and Slope (Canada-Nova Scotia offshore area), bbox: [-67.0, 40.5, -56.0, 47.0]}
