id: cnsoer/directory-of-offshore-wells
title: Directory of Offshore Wells (Nova Scotia offshore area)
summary: >-
  The Canada-Nova Scotia Offshore Energy Regulator's list of offshore wells: well name, company,
  drilling unit, location, spud date, well termination date, RT elevation, water depth, total
  depth, well type, classification and status, published on the Data Management Centre's public
  data summary.
