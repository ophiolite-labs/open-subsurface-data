  notes: "The GIS data page lists 'Geothermal Wells Feb. 2024 41 MB'. Layer 7 'Measured Geothermal Gradient (degrees C/km)' of the Geothermal map service holds 489 wells with temperature, depth, gradient, heat flow and plot links; layer 11 holds calculated gradients."
