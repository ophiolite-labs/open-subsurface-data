id: wa-dnr/geothermal-wells
title: Geothermal Wells (Washington State geothermal well database)
summary: >-
  "Information on the location, heat characteristics, and availability of water chemistry of known
  geothermal and heat flow wells in the state of Washington", compiled from DNR, WGS and Southern
  Methodist University databases and new temperature-gradient data from the National Geothermal Data
  System. Chemical analyses and scanned geophysical logs are available for some wells.
