id: wa-dnr/geophysics-database
title: Geophysics Database (Washington Geological Survey, Digital Data Series 28)
summary: >-
  Washington Geological Survey's compilation of geophysical surveys: gravity observations, profiles,
  base stations and anomaly maps, magnetic observations and anomaly maps, seismic profiles, ground
  penetrating radar and electrical profiles, with project locations. "A gravity station is a point
  where a gravity measurement was made on the Earth's surface."
