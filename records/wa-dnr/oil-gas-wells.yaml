id: wa-dnr/oil-gas-wells
title: Oil and Gas Wells (Washington Geological Survey, Digital Data Series 21)
summary: >-
  "These data contain point locations that represent oil and gas test well sites in Washington State
  from 1890 to present." Each well carries API and state file numbers, well and company names,
  elevation, depth, permit, drill start and stop dates, hydrocarbon show, status, location and whether
  scanned documents exist.
