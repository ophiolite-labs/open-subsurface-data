  notes: "The GIS data page lists 'Oil and Gas Wells Feb. 2019 5 MB' (ger_portal_oil_gas_wells.zip on fortress.wa.gov). Layer 1 of the Oil_and_Gas_Wells map service holds 830 wells, maxRecordCount 2000."
