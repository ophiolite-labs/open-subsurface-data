id: wa-dnr/groundwater-chemistry
title: Groundwater Chemistry (Washington Geological Survey, Digital Data Series 32)
summary: >-
  "Groundwater chemistry information on groundwater within Washington State, and includes data from
  springs, oil and gas wells, a carbon capture well, and water wells": major anions and cations, pH,
  trace elements and isotopes, "intended to aid public research in hydrogeology, geologic carbon
  sequestration feasibility, and geothermal exploration."
