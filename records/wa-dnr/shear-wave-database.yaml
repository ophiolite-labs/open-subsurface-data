id: wa-dnr/shear-wave-database
title: Shear Wave Database (Washington Geological Survey, Digital Data Series 17)
summary: >-
  "A compilation of shear-wave data from studies performed by the Washington Geological Survey, the
  U.S. Geological Survey, and the Environmental and Engineering Geophysical Society": strong-motion
  sensor site locations with Vs30 and two related tables of S-wave and P-wave velocity data obtained
  at those sites.
