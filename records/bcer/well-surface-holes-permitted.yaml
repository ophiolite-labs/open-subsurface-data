id: bcer/well-surface-holes-permitted
title: Well Surface Hole (Permitted)
summary: >-
  Non-confidential information about the surface location of every permitted well in British
  Columbia from the BC Energy Regulator, with a status view giving the current status of the
  surface hole. Data is updated nightly.
