known_issues:
  - "The licence depends on the channel: the same layer on the BC Data Catalogue is Access Only under BC copyright, and the BCER Data Centre downloads (iris.bcogc.ca) carry terms that say they may not be reproduced or redistributed. This record is the open data portal item."
  - "bbox is the extent stated in the publisher's ArcGIS item; its east edge (-110.84) lies east of British Columbia."
