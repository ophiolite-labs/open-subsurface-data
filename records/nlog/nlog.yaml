    format: wfs
    crs: "EPSG:23031"
    stated: "WFS capabilities DefaultCRS urn:ogc:def:crs:EPSG::23031 for All boreholes; responses declare it"
  - name: surveys-3d
    url: "https://www.gdngeoservices.nl/geoserver/nlog/ows?service=WFS&version=2.0.0&request=GetFeature&typeNames=nlog:gdw_ng_smc_grid_utm"
    format: wfs
    crs: "EPSG:4230"
    stated: "WFS capabilities DefaultCRS urn:ogc:def:crs:EPSG::4230 for 3D Seismic; responses declare it"
