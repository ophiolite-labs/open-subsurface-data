id: nlog/nlog
title: NLOG, Netherlands Oil and Gas Portal
summary: >-
  The Dutch public register of boreholes, seismic surveys, fields and production,
  with released well logs and seismic data under the Mining Act.
publisher: {name: "TNO Geological Survey of the Netherlands", url: https://www.nlog.nl, country: NL}
origin:
  url: https://www.nlog.nl/en/data
  access: anonymous
  manifest_url: https://www.nlog.nl/en/boreholes
licence:
  name: NLOG terms of use (public data under the Dutch Mining Act)
  spdx: null
  url: https://www.nlog.nl/en/disclaimer
  redistribution: unknown
  attribution: required
kinds: [wellbore-headers, wellbore-logs, wellbore-paths, tops, seismic-2d, seismic-3d, production, reports]
region: {country: NL, basin: Netherlands onshore and offshore, bbox: [2.5, 50.7, 7.3, 55.9], crs: "EPSG:28992"}
listed_by: [publisher, community]
known_issues:
  - Ophiolite already ships an NLOG sample in its try-it image (E79); keep the two consistent at L4.
inputs:
  - name: boreholes
    url: "https://www.gdngeoservices.nl/geoserver/nlog/ows?service=WFS&version=2.0.0&request=GetFeature&typeNames=nlog:gdw_ng_wll_all_utm"
    format: wfs
    crs: "EPSG:23031"
    stated: "WFS capabilities DefaultCRS urn:ogc:def:crs:EPSG::23031 for All boreholes; responses declare it"
  - name: surveys-3d
    url: "https://www.gdngeoservices.nl/geoserver/nlog/ows?service=WFS&version=2.0.0&request=GetFeature&typeNames=nlog:gdw_ng_smc_grid_utm"
    format: wfs
    crs: "EPSG:4230"
    stated: "WFS capabilities DefaultCRS urn:ogc:def:crs:EPSG::4230 for 3D Seismic; responses declare it"
period:
  start: "1800"
  end: "2026-10-23"
  stated: "NLOG WFS All boreholes (6738): earliest START_DATE_DRILLING 1800-01-01 (5 boreholes, likely a placeholder; next 1828-01-01), latest 2026-10-13; register live, end = date read 2026-10-23"
added: 2026-10-23
