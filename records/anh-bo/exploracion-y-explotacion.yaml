id: anh-bo/exploracion-y-explotacion
title: Exploración y Explotación (ANH Bolivia upstream maps and field sheets)
summary: >-
  The Agencia Nacional de Hidrocarburos' "Documentación actualizada e histórica sobre el Upstream en
  Bolivia": maps of reserved areas, geological structures, the geological map, well drilling (Perforación
  de Pozos), gas processing plants and the chronostratigraphic scale, and one sheet per field in
  operation (Campos en Operación, 55 fields) with location map and generalised stratigraphic column.
