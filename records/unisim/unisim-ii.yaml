id: unisim/unisim-ii
title: "UNISIM-II: Benchmark Case Proposal Based on a Carbonate Reservoir"
summary: >-
  A synthetic carbonate reservoir model created by UNISIM-CEPETRO-Unicamp to compare methodologies
  and performance of techniques, simulators and algorithms. Cases for field development
  (UNISIM-II-D), field management (-M) and uncertainty reduction (-H), with black-oil (IMEX) and
  compositional (GEM) decks, uncertainty sets and history data.
