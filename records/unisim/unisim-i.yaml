id: unisim/unisim-i
title: "UNISIM-I: Benchmark Case"
summary: >-
  The first benchmark model created by UNISIM-CEPETRO-Unicamp, to compare methodologies and
  performance of techniques, simulators and algorithms, built on Namorado field data. Cases for
  production-strategy selection (UNISIM-I-D), history matching (-H) and management (-M) ship IMEX,
  ECLIPSE and OPM Flow decks with history data; UNISIM-I-R adds synthetic seismic volumes.
