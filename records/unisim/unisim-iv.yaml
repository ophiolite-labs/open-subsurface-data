id: unisim/unisim-iv
title: "UNISIM-IV: Benchmark Proposal for Light-Oil Carbonate Reservoir with High CO2 Content"
summary: >-
  An open-source benchmark with geological and operational characteristics of Brazilian pre-salt
  fields: a light-oil carbonate reservoir with high CO2 content. Each case provides prior
  uncertainties for probabilistic studies, production, injection and history data, and a
  suggested base-case simulation model (compositional, WAG-CO2).
