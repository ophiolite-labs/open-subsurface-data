id: lgt/geologiniai-tyrimai
title: Geologinių tyrimų ataskaitų katalogas (catalogue of geological survey reports)
summary: >-
  "Geologinių tyrimų ataskaitų katalogą sudaro geologinio kartografavimo, giluminių tyrimų,
  seismologinio monitoringo, ekogeologinių tyrimų, hidrogeologinių tyrimų, požeminės hidrosferos
  monitoringo ir kitų geologinių tyrimų rezultatai (ataskaitos)." (The catalogue of the reports of
  geological mapping, deep investigations, seismological monitoring and other surveys, in which
  boreholes were drilled and geophysical investigations carried out.)
publisher: {name: Lietuvos geologijos tarnyba prie Aplinkos ministerijos (Lithuanian Geological Survey), url: https://lgt.lrv.lt, country: LT}
origin:
  url: https://data.gov.lt/datasets/1325/
  access: anonymous
  manifest_url: https://data.gov.lt/datasets/1325/
  notes: "data.gov.lt lists CSV, JSON, JSONL and RDF exports of the table GeologinisTyrimas, served from get.data.gov.lt/datasets/gov/lgt/geologiniai_tyrimai/; updated weekly ('Kas savaitę')."
licence:
