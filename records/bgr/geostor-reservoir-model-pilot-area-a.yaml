id: bgr/geostor-reservoir-model-pilot-area-a
title: Reservoir-modelling and parametrization of a potential reservoir structure (Pilot area A) in the German North Sea
summary: >-
  "As part of the CDRmare joint project GEOSTOR ... the BGR created detailed static geological 3D
  models for two potential CO2 storage structures in the Middle Buntsandstein." Pilot area A (~1300
  km2, Henni salt pillow) is "based on 2D seismic data from various surveys and ... four exploration
  wells", with 14 faults and 14 horizons, as a SKUA-GOCAD project.
