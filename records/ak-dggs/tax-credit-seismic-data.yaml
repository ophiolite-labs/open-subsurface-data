id: ak-dggs/tax-credit-seismic-data
title: Alaska tax credit seismic data (Geologic Materials Center)
summary: >-
  Seismic data acquired under the Alaska exploration tax credit program (AS 43.55) and distributed by the DGGS Geologic Materials Center. Data are ordered by form and invoiced; qualifying research, educational or government institutions may receive them at no cost.
