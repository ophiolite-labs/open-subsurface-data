id: marum/bremen-core-repository
title: Bremen Core Repository (BCR), Scientific Ocean Drilling Programs
summary: >-
  One of three IODP core repositories, operated at the University of Bremen: DSDP, ODP and IODP
  cores from the Atlantic Ocean, Mediterranean, Black and Baltic Seas and Arctic Ocean, more than
  193 km of deep-sea cores from 107 expeditions in around 300,000 boxes. Scientists request samples
  from any leg or expedition.
publisher: {name: "MARUM – Center for Marine Environmental Sciences, University of Bremen", url: https://www.marum.de, country: DE}
origin:
  url: https://www.marum.de/en/Bremen-Core-Collection-Scientific-Ocean-Drilling-Programs.html
  access: request
  notes: "Samples and data are requested through the Sample, Data and Research Request Manager (https://web.iodp.tamu.edu/SDRM/#/). Leg and expedition list at https://www.marum.de/en/Cores-at-the-BCR.html. The curatorial interface xdis.marum.de timed out on 23 Oct 2026."
