id: pgi/cbdg-boreholes
title: Centralna Baza Danych Geologicznych – podsystem Otwory wiertnicze
summary: >-
  The Boreholes subsystem of the Central Geological Database (CBDG) holds information on boreholes drilled in Poland and the investigations carried out in them, from the end of the nineteenth century to the present.
