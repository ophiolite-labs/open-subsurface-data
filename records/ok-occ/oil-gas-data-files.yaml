title: Oklahoma Oil and Gas Data Files
summary: >-
  Downloadable files from the Oklahoma Corporation Commission Oil and Gas Conservation Division with information on oil, gas and underground injection wells: RBDMS well data (CSV and shapefile, nightly), well completions since 2010, intent-to-drill files, and yearly UIC injection volumes with monthly injection pressures, plus historical files.
