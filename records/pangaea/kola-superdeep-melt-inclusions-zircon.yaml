id: pangaea/kola-superdeep-melt-inclusions-zircon
title: Composition of melt inclusions and age of zircons of plagiogneisses from the Kola Superdeep Borehole
summary: >-
  "A comprehensive study of melt inclusions and SHRIMP dating of zircons from trondhjemite gneisses
  of the sequence VIII from the Kola Superdeep Borehole has revealed presence of old primary
  magmatic crystals with age up to 2887+/-15 Ma." Supplement to Chupin et al. (2006), Doklady Earth
  Sciences 406(4).
