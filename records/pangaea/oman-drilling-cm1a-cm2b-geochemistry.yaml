id: pangaea/oman-drilling-cm1a-cm2b-geochemistry
title: Lithology, volatile, major and trace element composition of Holes CM1A and CM2B ultramafic samples, SE Oman ophiolite
summary: >-
  "The database reports the results of bulk rock geochemical measurements realized on 105 ultramafic
  lithologies (harzburgites and dunites) samples collected from Holes CM1A (46 samples) and CM2B (59
  samples) drilled in the Wadi Tayin massif in the SE of the ophiolite during Phase 2 of the ICDP
  OmanDP (Nov. 2017-Jan. 2018)."
