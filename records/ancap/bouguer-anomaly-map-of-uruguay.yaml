id: ancap/bouguer-anomaly-map-of-uruguay
title: New Bouguer Anomaly map of Uruguay
summary: >-
  ANCAP's updated Bouguer gravity anomaly map of Uruguay, presented at the X Uruguayan Geology
  Congress (2022), prepared from gravimetric stations measured between 1950 and 2018 by ANCAP, the
  Military Geographic Service, DINAMIGE with BGR, the College of Engineering of the University of
  the Republic and Campo Alegría; the grid used is offered for download with the article and map.
