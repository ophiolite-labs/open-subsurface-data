id: cnloer/production-statistics
title: Statistical Information (Resource Management, Exploration, Safety and Environment Statistics)
summary: >-
  C-NLOER's statistical information for the Canada-Newfoundland and Labrador offshore area: monthly
  production graphs and production summaries by well for the Hebron, Hibernia, North Amethyst, Terra
  Nova and White Rose fields, total offshore production, geophysical activity summaries (1996 to 2025)
  and cumulative seismic, survey, gravity and magnetics data acquired per year.
