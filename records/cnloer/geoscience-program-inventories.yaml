id: cnloer/geoscience-program-inventories
title: Geological Program Inventory and Geoscientific Report Inventory (Canada-Newfoundland and Labrador offshore area)
summary: >-
  C-NLOER's lists of geological programs and geoscientific reports for the offshore area: program
  number, title, operator, wells or permits, region (Labrador North and South, Eastern, Southern and
  Western Newfoundland, Jeanne d'Arc) and data release date, and the regulator's own geoscientific
  report numbers and titles.
