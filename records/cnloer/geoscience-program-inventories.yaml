  access: anonymous
  manifest_url: https://www.cnloer.ca/geoscience/
  notes: "The Geoscience Information list on the page links foageol.xlsx (486,211 bytes, Last-Modified 18 Dec 2025; 508 rows) and georepinv.xlsx (98,731 bytes; 579 rows) on the former www.cnlopb.ca host, read on 23 Oct 2026, beside Geotechnical and Environmental Program inventories. Requests for the programs go to information@cnlopb.ca."
