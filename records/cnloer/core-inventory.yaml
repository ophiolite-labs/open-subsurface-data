id: cnloer/core-inventory
title: Core Inventory (Canada-Newfoundland and Labrador offshore area)
summary: >-
  C-NLOER's inventory of conventional cores from offshore Newfoundland and Labrador wells, one row
  per core: well number and name, core number, number of boxes, start and end of core, cut, recovery
  and percent recovery. The cores are held at the regulator's Core Storage and Research Centre.
