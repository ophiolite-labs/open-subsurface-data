  redistribution: forbidden
  attribution: unknown
  terms:
    stated: "Communicate interest in blocks; Send data list; Express interest in datasets; Send confidentiality agreement; Sign agreement, execute payment and send receipt; ... Browse and preview data; Visualize limited images files; Request data for download; Send licence agreement and data pricing; Sign licence agreement and execute payment; Download data and analyse it"
    duration: null
    review_before_publication: null
    expires: null
kinds: [seismic-2d, seismic-3d, wellbore-headers, reports]
