id: petroci/virtual-data-room
title: PETROCI Virtual Data Room (Côte d'Ivoire open blocks)
summary: >-
  PETROCI's virtual data room for the Côte d'Ivoire sedimentary basin: per open block (Abidjan Margin,
  Onshore, San Pedro Margin, Ultra Deep) the public pages state 2D seismic (km), 3D seismic (sq km) and
  wells, with plays and leads. Access is by request form, then a confidentiality agreement, payment and a
  licence agreement before data are viewed or downloaded.
publisher: {name: PETROCI Holding, url: https://www.petroci.ci, country: CI}
origin:
  url: https://www.petrocivirtualdataroom.ci/
  access: purchase
  notes: "Request form https://www.petrocivirtualdataroom.ci/resquest-form.html (request type 'Browse and preview data' or 'Download Data'); process chart Processus_Commercial_VDR_PETROCI_CLIENT.pdf linked from /diagram.html; contact infosVDRr@petroci.ci."
licence:
