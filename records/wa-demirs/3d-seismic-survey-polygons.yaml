  spdx: CC-BY-4.0
  url: https://creativecommons.org/licenses/by/4.0/
  redistribution: allowed
  attribution: required
kinds: [seismic-3d]
region: {country: AU, basin: "Western Australian basins, onshore and offshore", bbox: [111.488, -33.066, 128.974, -10.451], crs: "EPSG:7844"}
listed_by: [publisher]
known_issues:
  - "Survey outlines only, no traces; seismic-3d is the nearest kind."
  - "bbox is the CKAN package's spatial rectangle."
period:
  start: "1981-10-29"
  end: "2024-03-23"
  stated: "start_date and end_date in the publisher's ArcGIS layer 24: earliest start 1981-10-29, latest end 2024-03-23 (24 Oct 2026)"
