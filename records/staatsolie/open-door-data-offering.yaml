id: staatsolie/open-door-data-offering
title: Staatsolie GeoPortal Special Open-Door Data Offering (Suriname offshore)
summary: >-
  As part of its Offshore Open-Door Offering Campaign, Staatsolie offers companies leases of its
  Suriname exploration data by data type (all wells, all 2D seismic, all 3D seismic, all gravity
  and magnetic data, all technical reports) through the GeoPortal LeaseStore, or access to all
  data in a virtual data room. Location shapefiles of wells, 2D lines and 3D surveys available
  for lease are offered as free downloads.
publisher: {name: Staatsolie Maatschappij Suriname N.V., url: https://www.staatsolie.com/en/, country: SR}
