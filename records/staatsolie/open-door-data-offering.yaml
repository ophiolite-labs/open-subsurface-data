known_issues:
  - "Data are leased, not sold; no licence text, lease length or reuse terms are stated on the GeoPortal pages read. The 2025-2027 dates are the offer's validity, not a licence term."
  - "Kinds follow the data types offered; wellbore-headers stands for \"All Wells\", whose contents are not itemised. bbox is Suriname with its offshore, approximate."
notes: "licence.terms.stated quotes the Open-Door Offering page (ArcGIS Hub page item 262b5d99691a48c983b1de427bee60e1, updated 2026-06-23) as read on 23 Oct 2026. The page adds that data newly added to a leased type in the five years from 24 November 2025 is provided at the same discount rate."
