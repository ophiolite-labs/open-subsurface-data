  access: purchase
  notes: "Free location shapefiles (wells 7 KB, 2D seismic lines 1,611 KB, 3D surveys, Open-Door sectors, offshore blocks) on https://geoportal-staatsolie.hub.arcgis.com/pages/downloadables. Cart links go to geoportalstore.com (robots.txt disallows all). The Hub robots.txt asks for Crawl-delay: 60."
