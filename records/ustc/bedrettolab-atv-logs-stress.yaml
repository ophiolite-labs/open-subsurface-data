id: ustc/bedrettolab-atv-logs-stress
title: ATV logs, ellipticity data, and stress inversion results from boreholes in the BedrettoLab
summary: >-
  Acoustic televiewer (ATV) logs from boreholes CB1 (MB1), CB2 (MB2), CB3 (MB3), MB4, MB5, MB8,
  ST1 and ST2 in the Bedretto Underground Laboratory for Geosciences and Geoenergies (Swiss Alps):
  acoustic amplitudes, traveltimes, traveltime-derived borehole radii and masks of breakouts,
  keyseats and pre-existing fractures, the ellipticity data derived from them, and the stress
  orientations and relative magnitudes inverted from the ellipticity.
