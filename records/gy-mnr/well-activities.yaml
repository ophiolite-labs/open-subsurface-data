id: gy-mnr/well-activities
title: Well Activities (Guyana Petroleum Management Programme)
summary: >-
  The Ministry of Natural Resources' table of exploration and appraisal wells drilled in Guyana,
  onshore and offshore: well name, fluid type, block, operator, well type, well date, longitude,
  latitude and water depth, filterable by fluid, block and operator, from the 1960s Guyana Offshore
  wells to the Stabroek Block wells of 2025.
publisher: {name: "Ministry of Natural Resources, Guyana (Petroleum Management Programme)", url: https://petroleum.gov.gy, country: GY}
origin:
  url: https://petroleum.gov.gy/well-activities/
  access: anonymous
  notes: "An HTML table on the page; no file download. The programme's Data Centre (https://petroleum.gov.gy/data-centre/) also charts oil, gas and water production from 20 December 2019."
