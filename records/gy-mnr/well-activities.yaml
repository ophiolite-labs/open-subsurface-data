known_issues:
  - "The only rights statement is the site footer \"© 2026 All Rights Reserved.\"; no licence is named for the table."
  - "Well dates are written in mixed day/month and month/day order (e.g. \"25/05/1971\", \"4/26/1976\"); some wells carry no date or depth."
  - "bbox is the extent of the coordinates in the table on 23 Oct 2026, rounded outwards."
notes: "No period is written: the page states dates per well but no interval for the table."
