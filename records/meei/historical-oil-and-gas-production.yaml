id: meei/historical-oil-and-gas-production
title: Historical Oil and Gas Production Data (Trinidad and Tobago, 1908-2018)
summary: >-
  The Ministry of Energy and Energy Industries' annual production series for Trinidad and Tobago:
  Annual Crude Oil and Condensate Production (1908-2018) and Annual Natural Gas Production
  (1908-2018), each offered for download as PDF and Excel on the Ministry's Data pages.
