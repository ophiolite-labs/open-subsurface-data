id: gsnsw/drillholes-core-library
title: NSW Drillholes Core Library
summary: >-
  Drillholes of the NSW drilling dataset ("over 140,000 non-confidential drillholes related to the
  activities of the mineral, coal and petroleum industries, as well as government drilling
  programs") that are "physically held (either wholly or in part) at the Department’s core library
  facilities across the state, the main core library located at Londonderry NSW": about 8 % of them,
  with intervals, material and location in the library.
