id: tudelft/egg-model
title: The Egg Model - data files
summary: >-
  A synthetic reservoir model of an ensemble of 101 relatively small three-dimensional
  realizations of a channelized reservoir produced under water flooding with eight injectors and
  four producers; this deposit is the standard version meant to serve as a test case, with input
  files for Dynamo/MoReS, Eclipse, AD-GPRS and MRST.
