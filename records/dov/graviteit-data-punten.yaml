id: dov/graviteit-data-punten
title: Bouguer graviteit-data punten (Brabant Massif gravity points, WFS layer gravimetrie:graviteit_data_punten)
summary: >-
  Bouguer gravity points from the 2004 gravity study of the Brabant Massif, carried out by the British
  Geological Survey with GF Consult and the Belgian Geological Survey for ANRE (VLA04-3.1): "Deze
  kaartlaag geeft de nieuwe meetpunten weer die verwerkt werden in deze studie, met meetwaarden van de
  Bouguer graviteit." Each point has its value in mGal and Lambert 72 coordinates and height.
