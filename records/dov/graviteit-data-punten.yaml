  notes: "The layer is named in the DOV WFS capabilities (https://www.dov.vlaanderen.be/geoserver/wfs) with metadata record 979b8735-9093-4fb7-a74f-a48d1ff4caf7 and the keyword 'geofysica'. The manifest_url is a GetFeature of the first 1,000 of 16,915 points (numberMatched on 23 Oct 2026), 236,439 bytes, filename=graviteit_data_punten.json."
