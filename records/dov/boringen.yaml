id: dov/boringen
title: Boringen (DOV boreholes, WFS layer dov-pub:Boringen)
summary: >-
  The Databank Ondergrond Vlaanderen (DOV) boreholes: "In de DOV-databank is elke waarneming van
  grondlagen een boring." Each borehole carries its number, depth, start date, municipality, driller,
  purpose, method and which descriptions exist (lithology, formal and informal stratigraphy,
  hydrogeological stratigraphy, geotechnical coding), with a link to its record sheet and borehole report.
publisher: {name: Databank Ondergrond Vlaanderen (DOV), url: https://www.dov.vlaanderen.be, country: BE}
origin:
  url: https://www.dov.vlaanderen.be/page/boringen
  access: anonymous
  manifest_url: "https://www.dov.vlaanderen.be/geoserver/wfs?service=WFS&version=2.0.0&request=GetFeature&typeNames=dov-pub:Boringen&count=1000&outputFormat=application/json"
  notes: "The DOV services page names the WFS https://www.dov.vlaanderen.be/geoserver/wfs as a download service 'door iedereen' to use. The manifest_url is a GetFeature of the first 1,000 of 188,507 boreholes (numberMatched on 23 Oct 2026), 1,099,736 bytes, Content-Disposition inline; filename=Boringen.json. The DOV-Verkenner and pydov are the publisher's other routes to the same data."
licence:
  name: Modellicentie voor gratis hergebruik (Vlaamse overheid), per the DOV services terms of use
  spdx: null
  url: https://www.dov.vlaanderen.be/page/gebruiksvoorwaarden-dov-services
  redistribution: allowed
  attribution: unknown
kinds: [wellbore-headers, reports]
region: {country: BE, basin: Flanders, bbox: [2.3763, 49.1677, 5.9961, 52.7875], crs: "EPSG:31370 (Belgian Lambert 72)"}
listed_by: [publisher]
known_issues:
  - "Terms: 'Voor de gebruiksvoorwaarden op de DOV-data wordt verder verwezen naar de modellicentie voor gratis hergebruik. Onder deze licentie doet de instantie geen afstand van haar intellectuele rechten, maar mag de data voor eender welk doel hergebruikt worden, gratis en onder minimale restricties.'"
  - "The terms page also says to read the access and use conditions in each dataset's metadata."
  - "bbox is the layer's WGS84BoundingBox in the WFS capabilities (it reaches beyond Flanders)."
  - "Many boreholes are surface observations: 'In de databank staan er dan ook verschillende boringen met een diepte van 0 meter.'"
notes: "Period from the WFS field datum_aanvang: earliest 1800-01-01, latest real date 2026-10-21; three boreholes carry dates in 2042 and 2205."
period:
  start: "1800"
  end: "2026-10-23"
  stated: "WFS dov-pub:Boringen sorted on datum_aanvang: earliest 1800-01-01 (BGD088W0060, Jette), next 1829-01-01; latest real 2026-10-21 (2001-B2026097, Berlaar); continuously updated, so 1800 to today"
added: 2026-10-23
