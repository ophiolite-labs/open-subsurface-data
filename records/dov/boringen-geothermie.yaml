  The DOV boreholes drilled for geothermal use: "Deze laag toont enkel de boringen met als doel
  'Geothermie' met aanvangsdatum vanaf 01-01-2017." Each borehole carries its number, depth, start
  date, driller, method, Lambert 72 coordinates and which descriptions exist, with a link to its
  record sheet and borehole report.
