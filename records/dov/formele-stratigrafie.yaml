id: dov/formele-stratigrafie
title: Formele stratigrafie (DOV formal stratigraphy interpretations, WFS layer interpretaties:formele_stratigrafie)
summary: >-
  DOV's formal stratigraphy of boreholes and cone penetration tests: "Een formele stratigrafie van een
  boring of een sondering is een lithostratigrafische interpretatie van een (gecodeerde) lithologische
  beschrijving ... per diepte-interval." It is used to identify the thickness of the Quaternary and the
  underlying Neogene, Paleogene and older units. Each interpretation links its record sheet and test.
