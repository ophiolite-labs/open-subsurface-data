id: nbmg/oil-gas-wells-through-2013
title: "Oil and Gas: Wells Through 2013"
summary: >-
  "This layer shows the location of oil and gas wells through 2013 in Nevada", from the Nevada Bureau of
  Mines and Geology's oil and gas well database, "compiled from various data sources including drilling
  permits, drilling reports, completion reports, lithologic and drillers logs, electric logs" and company
  transmittals. Each well carries API number, county, operator, name, status, total depth, tests, logs,
  samples, shows and field.
