id: nsta/production-data-by-field
title: UKCS petroleum production data by field (ED50)
summary: >-
  "Contains layers of wells, fields and hubs with download links to their daily production data."
  Daily gas, oil and H2O values, with well-head and bottom-hole pressures and temperatures where
  available, reported at cessation of production; "applied to all UKCS fields that have ceased
  production since January 2018."
publisher: {name: North Sea Transition Authority, url: https://www.nstauthority.co.uk, country: GB}
origin:
  url: https://www.arcgis.com/home/item.html?id=5591b61ebc18422380c605ffec1a658b
  access: anonymous
  manifest_url: https://services-eu1.arcgis.com/OZMfUznmLTnWccBc/arcgis/rest/services/UKCS_petroleum_production_data_by_field_(ED50)/FeatureServer/0?f=json
  notes: "ArcGIS Online item 5591b61ebc18422380c605ffec1a658b. Layer 0 has 40 field polygons; each URL attribute points to a zip on datanstauthority.blob.core.windows.net/external/CoP_Field_Production_Data/By_Field/Data/. Downloads by wellbore and by hub are in the same service."
licence:
  name: NSTA Open User Licence
  spdx: null
  url: https://www.nstauthority.co.uk/media/u51lhvio/nsta-user-agreeement-june-2023.pdf
  redistribution: restricted
  attribution: required
  statement: "Contains information provided by the North Sea Transition Authority and/or other third parties."
kinds: [production, pressure]
region: {country: GB, basin: UK continental shelf, bbox: [-0.05, 53.21, 2.72, 58.80], crs: "EPSG:4230"}
listed_by: [publisher]
known_issues:
  - "Licence (June 2023 user agreement): 'You are free to: copy, publish, distribute and transmit the Information; adapt the Information; exploit the Information non-commercially.'"
  - "bbox is the layer's stated extent (ED50). The sample hashes the layer's features, not the production zips."
notes: "No period stated beyond 'fields that have ceased production since January 2018'; each field's history runs over its whole life."
