id: nm-ocd/oil-and-gas-wells
title: New Mexico OCD Oil and Gas Wells
summary: >-
  Point features for the surface drilling location of energy production wells (oil, gas, CO2),
  including injection and salt water disposal wells, in New Mexico, maintained by the Oil
  Conservation Division of the Energy, Minerals and Natural Resources Department and updated
  daily; a well is added when an Application for Permit to Drill is approved.
