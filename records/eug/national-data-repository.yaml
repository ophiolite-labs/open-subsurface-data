id: eug/national-data-repository
title: National Data Repository - NDR (Egypt Upstream Gateway)
summary: >-
  Egypt Upstream Gateway is the country's digital platform for the upstream sector, launched by
  the Ministry of Petroleum with SLB in February 2021, for digitizing, storing and making Egypt's
  national data accessible worldwide. Its National Data Repository counts wells, 2D and 3D
  seismic and gravity/magnetic surveys.
