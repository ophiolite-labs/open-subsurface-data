id: usgs/ofr-2009-1021-las-gamma-ray-logs
title: "LAS Files for Gamma Ray Well Logs, Cross Section C-C' Through the Central Appalachian Basin (OFR 2009-1021)"
summary: >-
  USGS Open-File Report 2009-1021 (Trippi and Crangle) "summarizes the procedures used to convert gamma
  ray curves on paper well logs to the digital Log ASCII ... Standard (LAS) format". "The LAS files
  from the gamma ray logs of 11 wells used to construct cross section C-C' are included in this
  report. They may be downloaded from the index page as a single ZIP file."
