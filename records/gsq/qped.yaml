id: gsq/qped
title: Queensland Petroleum Exploration Data-QPED
summary: >-
  2017 database extract from MERLIN with geological, geophysical and geochemical data on
  Queensland's sedimentary basins from petroleum wells, coal seam gas wells and stratigraphic
  bores: well history, company and GSQ stratigraphy, drill stem tests, wireline logs, downhole
  temperatures, analytical data, biostratigraphy and hydrocarbon indications.
