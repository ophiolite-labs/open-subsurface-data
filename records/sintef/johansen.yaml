id: sintef/johansen
title: The Johansen Data Set
summary: >-
  Geological model of the Johansen formation, a candidate site for large-scale CO2 storage offshore south-west Norway, developed in the MatMoRA project from available seismic and well data: a 149x189x16 full-field corner-point model, four 100x100 sector models (one with heterogeneous rock properties), porosity and permeability, PVT and relative permeability tables.
