id: mase-unmig/videpi-seismic
title: ViDEPI seismic lines from expired mining titles, marine reconnaissance and CROP
summary: >-
  Seismic sections published by ViDEPI: 2,489 lines acquired in expired hydrocarbon titles (PDF), 171 lines as digital SEG-Y, 578 lines of the marine reconnaissance survey (Zone marine) and 70 lines of the CROP Atlas deep crustal profiles, documents of titles expired up to 31 December 2021.
publisher: {name: "Ministero dell'ambiente e della sicurezza energetica (UNMIG), ViDEPI project", url: https://www.mase.gov.it, country: IT}
origin:
  url: https://www.videpi.com/videpi/cessati/sgy.asp
  access: anonymous
  notes: PDF lines at https://www.videpi.com/videpi/cessati/sismica_titoli.asp, marine reconnaissance at /videpi/sismica/sismica.asp, CROP at /videpi/crop/crop.asp. SEG-Y files download directly (e.g. /deposito/videpi/sgy/1.sgy).
