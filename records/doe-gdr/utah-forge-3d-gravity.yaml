id: doe-gdr/utah-forge-3d-gravity
title: "Utah FORGE: 3D Gravity Data"
summary: >-
  3D geophysical inversion modelling of gravity data at the Utah FORGE site near Milford, Utah,
  to characterise the subsurface geologic framework and test the existing 3D geologic model:
  a readme and a report on model parameters, data used and geologic constraints, with two 3D
  density models as output.
