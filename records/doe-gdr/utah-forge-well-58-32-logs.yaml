id: doe-gdr/utah-forge-well-58-32-logs
title: "Utah FORGE: Logs and Data from Deep Well 58-32 (MU-ESW1)"
summary: >-
  Data, logs and graphics from the drilling and testing of Utah FORGE deep test well 58-32
  (MU-ESW1) near Roosevelt Hot Springs, Milford, Utah: Schlumberger logs (dipole shear sonic, FMI,
  array induction, porosity, triple combo, cement), a sonic LAS, dipole sonic waveforms,
  pressure/temperature logs, a one-foot drilling dataset to 7536 ft TD, Pason drilling logs,
  directional survey, mud log, daily drilling reports and the end of well report.
