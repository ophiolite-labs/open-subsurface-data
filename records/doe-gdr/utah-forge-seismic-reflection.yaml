  access: anonymous
  notes: "Author John Miller (geophysical consultant). 'Download All Resources 849.51 MB — 3 files'. Raw and initially processed 2D and 3D data (1122 3D shot-gather SEG-Y files, navigation, stack, velocities): https://gdr.openei.org/submissions/1015."
