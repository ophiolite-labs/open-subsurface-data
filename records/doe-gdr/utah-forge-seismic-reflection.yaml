id: doe-gdr/utah-forge-seismic-reflection
title: "Utah FORGE: Seismic Reflection Data"
summary: >-
  2D and 3D seismic reflection data from the Utah FORGE site near Roosevelt Hot Springs,
  reprocessed during Phase 2c and output as SEG-Y: unmigrated time, prestack time migration and
  prestack depth migration (unenhanced and enhanced), and the velocity model used for migration,
  with a readme and the reprocessing paper. The raw and initially processed shot gathers are in
  the linked submission 1015.
publisher: {name: "Energy and Geoscience Institute at the University of Utah (Utah FORGE), via the DOE Geothermal Data Repository", url: https://gdr.openei.org, country: US}
