id: csulb/san-pedro-basin-fault-mcs-2018
title: 2018 San Pedro Basin fault CSULB multichannel seismic reflection data
summary: >-
  High-resolution sparker multichannel seismic reflection profiles across the San Pedro Basin
  fault, offshore southern California: "We collected 33 new profiles totaling 365 line-km",
  acquired on the R/V Yellowfin in one-day cruises between Los Angeles Harbor and Two Harbors on
  Catalina Island during April-June 2018. SEG-Y (66 files) with navigation and figure PDFs.
