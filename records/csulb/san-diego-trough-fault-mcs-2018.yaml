id: csulb/san-diego-trough-fault-mcs-2018
title: 2018 San Diego Trough fault CSULB multichannel seismic reflection data
summary: >-
  High-resolution sparker multichannel seismic reflection profiles across the San Diego Trough
  fault zone, offshore southern California: "We collected six new profiles totaling 50 line-km",
  acquired on the R/V Point Loma over three single-day trips from San Diego in April 2018. SEG-Y
  (12 files) with navigation and figure PDFs.
