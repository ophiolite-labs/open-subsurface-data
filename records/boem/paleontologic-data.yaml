title: Paleontologic Information (Gulf of America releasable paleo reports)
summary: >-
  BOEM Data Center paleontologic information: "publicly releasable biostratigraphic and paleobathymetric
  summary information on active and expired fields and leases in the Gulf of America". Foraminiferal,
  coccolith, dinoflagellate, ostracod, radiolarian and pollen markers are placed in a chronostratigraphic
  and chronozonal context by the MMA Resource Evaluation biostratigrapher.
