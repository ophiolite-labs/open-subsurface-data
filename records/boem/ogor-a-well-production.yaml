id: boem/ogor-a-well-production
title: Oil and Gas Operations Reports - Part A (OGOR-A) Well Production 1996-Current
summary: >-
  BOEM Data Center production files: OGOR-A well production for the Gulf of America OCS, one
  fixed-width and one delimited zip per year from 1996 to the current year ("Well Production
  Information Available for June 2026" in the 2026 file). The production pages also give lease and
  operator rankings, OGOR-B and OGOR-C files and online queries.
