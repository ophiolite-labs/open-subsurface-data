# The one required check. Offline, under two minutes, GitHub-hosted. Nothing else gates a merge.
name: check
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { python-version: "3.12" }
      - run: uv sync --frozen || uv sync
      - name: tippecanoe 2.79.0 (Ubuntu package, pinned by hash; E15 tiles; 2.49 crossed strings, E32)
        run: |
          curl -fsSLo /tmp/tippecanoe.deb http://archive.ubuntu.com/ubuntu/pool/universe/t/tippecanoe/tippecanoe_2.79.0-1_amd64.deb
          echo "78261946e0ee8f6cb10c00c4aaf5e66858f0bfb9d870c530d6704fbcc67fb727  /tmp/tippecanoe.deb" | sha256sum -c
          sudo dpkg -i /tmp/tippecanoe.deb && tippecanoe --version
      - run: make check
      - name: site smoke (every data file the page fetches exists and parses)
        run: |
          test -s site/data/records.json && test -s site/data/outlines.geojson
          python3 -c "import json;json.load(open('site/data/records.json'));json.load(open('site/data/outlines.geojson'))"
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - name: site test (Playwright, offline; E05)
        timeout-minutes: 4
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --only-shell chromium   # the runner image has Chromium's system libraries; --with-deps stalls on apt
          make site-test
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with: { name: site, path: site, retention-days: 7 }
