[project]
name = "osd"
version = "0.1.0"
description = "Open Subsurface Data: a verified catalogue of open subsurface datasets, shown on a map"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4.18",
]

[project.scripts]
osd = "osd.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osd"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
