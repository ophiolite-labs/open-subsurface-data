<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What changed · Open Subsurface Data</title>
<meta name="description" content="What changed on Open Subsurface Data, newest first: what you can now do and where to click to see it.">
<link rel="stylesheet" href="style.css">
<style>
  #changes h2 { font-size: 13px; color: var(--muted); margin: 28px 0 6px; text-transform: none; letter-spacing: 0; }
  #changes ul { list-style: none; margin: 0; padding: 0; }
  #changes li { padding: 10px 0; border-bottom: 1px solid var(--line); line-height: 1.5; }
  #changes li a.open { margin-left: 6px; white-space: nowrap; }
  #changes li a.pr { margin-left: 8px; font-size: 12px; color: var(--muted); text-decoration: none; white-space: nowrap; }
</style>
</head>
<body class="page">
<main>
<p><a href="./">← Back to the map</a></p>
<h1>What changed</h1>
<p class="muted">The site is rebuilt and published each time a change is merged; there are no
versions to wait for. Newest first: what you can now do, and where to click to see it. The foot of
each page says when the site you are reading was built.</p>
<div id="changes"><p class="muted">Loading…</p></div>
</main>
<script>
(async () => {
  const el = document.getElementById('changes');
  const MONTHS = 'JanFebMarAprMayJunJulAugSepOctNovDec';
  const day = s => { const [y, m, d] = s.split('-'); return `${+d} ${MONTHS.substr(m * 3 - 3, 3)} ${y}`; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  try {
    const r = await fetch('data/changes.json');
    if (!r.ok) throw new Error(r.status);
    const { changes } = await r.json(), days = new Map();
    for (const c of changes) days.set(c.date, [...(days.get(c.date) || []), c]);
    el.innerHTML = changes.length ? [...days].map(([d, cs]) => `<section><h2><time datetime="${esc(d)}">${day(d)}</time></h2><ul>${cs.map(c =>
      `<li>${esc(c.title)} <a class="open" href="${esc(c.link)}">Open it</a><a class="pr" href="https://github.com/ophiolite-labs/open-subsurface-data/pull/${+c.pr}" title="The pull request">#${+c.pr}</a></li>`).join('')}</ul></section>`).join('')
      : '<p class="muted">Nothing yet.</p>';
  } catch (e) {
    el.innerHTML = '<p class="muted">The list of changes could not be read just now.</p>';
  }
})();
</script>
<script>addEventListener('load', () => { let t = 0, n = 0, o = new PerformanceObserver(() => t = 0); o.observe({ type: 'resource' }); const i = setInterval(() => { if (++t > 3 || ++n > 30) { clearInterval(i); o.disconnect(); document.body.append(Object.assign(document.createElement('script'), { src: 'foot.js' })); } }, 500); }) /* E54: the foot line, once the page is quiet */</script>
</body>
</html>
